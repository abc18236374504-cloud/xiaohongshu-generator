<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书爆款文案生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>小红书爆款文案生成器</h1>
            <p>输入关键词，一键生成吸睛文案！</p>
        </header>
        <main>
            <div class="input-area">
                <textarea id="keywords" placeholder="请输入你的产品或分享主题..."></textarea>
                <button id="generate-btn">生成文案</button>
            </div>
            <div class="result-area">
                <h2>生成结果：</h2>
                <div id="result" class="result-content">
                    <p>这里将显示生成的文案...</p>
                </div>
            </div>
        </main>
        <footer>
            <p>Powered by Jules</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
