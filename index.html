<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书爆款文案生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="card input-card">
            <div class="card-header">
                <h2>✍️ 创作你的爆款文案</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label for="topic">核心主题</label>
                    <input type="text" id="topic" placeholder="例如：夏日防晒、周末探店">
                </div>
                <div class="form-group">
                    <label for="note-type">笔记类型</label>
                    <select id="note-type">
                        <option value="种草安利">种草安利</option>
                        <option value="干货教程">干货教程</option>
                        <option value="探店评测">探店评测</option>
                        <option value="日常Vlog">日常Vlog</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tone-style">语气风格</label>
                    <select id="tone-style">
                        <option value="活泼可爱">活泼可爱</option>
                        <option value="温柔知性">温柔知性</option>
                        <option value="搞笑幽默">搞笑幽默</option>
                        <option value="专业严谨">专业严谨</option>
                    </select>
                </div>
                 <div class="form-group">
                    <label for="word-count">字数要求</label>
                    <select id="word-count">
                        <option value="200字左右">200字左右</option>
                        <option value="400字左右">400字左右</option>
                        <option value="600字左右">600字左右</option>
                    </select>
                </div>
                <button id="generate-btn">🚀 生成文案</button>
            </div>
        </div>

        <div class="card result-card">
            <div class="card-header">
                <h2>✨ 生成结果</h2>
            </div>
            <div class="card-body">
                <div id="result" class="result-content">
                    <p>这里将显示生成的文案...</p>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>Powered by Jules</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
